<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work - Wooden Spoke</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery {
            column-count: 3;
            column-gap: 15px;
            padding: 150px 30px;
        }
        .gallery img {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .gallery img:hover {
            transform: scale(1.15);
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <nav class="secondary-navbar">
        <div class="logo">
            <a href="index.html">Wooden Spoke</a>
        </div>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
            <li><a href="work.html" class="active">Work</a></li>
        </ul>
    </nav>

    <div class="gallery" id="work-gallery"></div>

    <footer>
        <div class="footer-content">
            <p>© 2024 Wooden Spoke. All rights reserved.</p>
            <p>Contact us: <a href="mailto:kevinmiller2012@gmail.com">kevinmiller2012@gmail.com</a></p>
        </div>
    </footer>

    <script>
        fetch('gallery.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('Could not load gallery.json');
                return response.json();
            })
            .then(photos => {
                const gallery = document.getElementById('work-gallery');
                photos.forEach(path => {
                    const img = document.createElement('img');
                    img.src = path;
                    img.alt = path.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
                    img.loading = 'lazy';
                    gallery.appendChild(img);
                });
            })
            .catch(error => console.error('Gallery could not load:', error));
    </script>
</body>
</html>
