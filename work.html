<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work - Wooden Spoke</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery {
            column-count: 3;
            column-gap: 15px;
            padding: 150px 30px;
        }
        .gallery img {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 8px;
        }
@media (max-width: 600px) {
    .gallery {
        column-count: 2;
        column-gap: 10px;
        padding: 100px 12px 40px;
    }

    .gallery img {
        margin-bottom: 10px;
    }

    .gallery img:hover {
        transform: none;
    }
}
    </style>
</head>
<body>
    <nav class="secondary-navbar">
        <div class="logo">
            <a href="index.html">Wooden Spoke</a>
        </div>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
            <li><a href="work.html" class="active">Work</a></li>
        </ul>
    </nav>

    <div class="gallery" id="work-gallery"></div>

    <footer>
        <div class="footer-content">
            <p>© 2024 Wooden Spoke. All rights reserved.</p>
            <p>Contact us: <a href="mailto:kevinmiller2012@gmail.com">kevinmiller2012@gmail.com</a></p>
        </div>
    </footer>

    <script>
        fetch('gallery.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('Could not load gallery.json');
                return response.json();
            })
            .then(photos => {
                const gallery = document.getElementById('work-gallery');
                photos.forEach(path => {
                    const img = document.createElement('img');
                    img.src = 'thumbnails/' + path.split('/').pop() + '.webp';
                    img.alt = path.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
                    img.loading = 'lazy';
                    gallery.appendChild(img);
                });
            })
            .catch(error => console.error('Gallery could not load:', error));
    </script>
    
<style>
    .gallery img {
        cursor: zoom-in;
    }

    .photo-viewer {
        border: none;
        padding: 0;
        background: transparent;
        max-width: 100vw;
        max-height: 100vh;
    }

    .photo-viewer::backdrop {
        background: rgba(0, 0, 0, 0.9);
    }

    .photo-viewer img {
        display: block;
        max-width: 95vw;
        max-height: 90vh;
        object-fit: contain;
    }

    .photo-close {
        position: fixed;
        top: 15px;
        right: 15px;
        background: white;
        color: black;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 25px;
        cursor: pointer;
    }
</style>

<dialog class="photo-viewer" id="photo-viewer">
    <button class="photo-close"
            aria-label="Close photo">×</button>
    <img id="enlarged-photo" alt="">
</dialog>

<script>
    const viewer = document.getElementById('photo-viewer');
    const enlarged = document.getElementById('enlarged-photo');

    document.getElementById('work-gallery')
        .addEventListener('click', event => {
            if (event.target.tagName === 'IMG') {
                enlarged.src = 'images/' + event.target.getAttribute('src').split('/').pop().replace(/\.webp$/, '');
                enlarged.alt = event.target.alt;
                viewer.showModal();
            }
        });

    viewer.querySelector('.photo-close')
        .addEventListener('click', () => viewer.close());

    viewer.addEventListener('click', event => {
        if (event.target === viewer) viewer.close();
    });
</script>

</body>
</html>
